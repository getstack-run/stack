apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stack-engine.fullname" . }}-worker
  labels:
    {{- include "stack-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "stack-engine.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stack-engine.selector" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "stack-engine.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "stack-engine.image" (dict "root" . "name" .Values.image.worker) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: health, containerPort: 8080 }
          env:
            {{- include "stack-engine.env" . | nindent 12 }}
            - { name: PORT, value: "8080" }
          # The worker answers /health on PORT whenever it is alive; it does not
          # probe its dependencies, so a database outage restarts nothing.
          readinessProbe:
            httpGet: { path: /health, port: health }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "stack-engine.secretVolume" . | nindent 8 }}
        - { name: tmp, emptyDir: {} }
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
