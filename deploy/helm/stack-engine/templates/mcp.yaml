{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stack-engine.fullname" . }}-mcp
  labels:
    {{- include "stack-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "stack-engine.selector" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stack-engine.selector" (dict "root" . "component" "mcp") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "stack-engine.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "stack-engine.image" (dict "root" . "name" .Values.image.mcp) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 3001 }
          env:
            - { name: STACK_DEPLOYMENT, value: self_managed }
            - { name: STACK_API_BASE_URL, value: {{ required "publicUrl is required (an https origin)" .Values.publicUrl | quote }} }
            {{- with .Values.mcpPublicUrl }}
            - { name: STACK_MCP_BASE_URL, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.issuer }}
            - { name: STACK_ISSUER, value: {{ . | quote }} }
            {{- end }}
            # The MCP server reaches the API over the cluster network.
            - { name: API_URL, value: "http://{{ include "stack-engine.fullname" . }}-api" }
            - { name: OAUTH_ENABLED, value: {{ .Values.oauth.enabled | quote }} }
            - { name: MCP_ELICITATION_ATTESTATION_KEY_FILE, value: /run/secrets/mcp-attestation-key }
            - { name: PORT, value: "3001" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        {{- include "stack-engine.secretVolume" . | nindent 8 }}
        - { name: tmp, emptyDir: {} }
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stack-engine.fullname" . }}-mcp
  labels:
    {{- include "stack-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  selector:
    {{- include "stack-engine.selector" (dict "root" . "component" "mcp") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
{{- end }}
