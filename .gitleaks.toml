# Generated by the exporter from the manifest's scan_allow entries: each names one file and one rule whose hit is a
# synthetic test string, not a credential. Nothing else is excused.
title = "stack"

[extend]
useDefault = true

[[allowlists]]
description = "gitleaks reads the idempotency_key fixture 'idem-key-12345' as a key. A request-field test value."
targetRules = ["generic-api-key"]
paths = ['''(^|[/\\])apps/api/src/routes/missions-start-operator\.test\.ts$''']

[[allowlists]]
description = "Test constant: an alternating letter-and-digit string that the test asserts never appears in a tool result. Not a credential."
targetRules = ["generic-api-key"]
paths = ['''(^|[/\\])packages/mcp-server/src/notification-secret-boundary\.test\.ts$''']

[[allowlists]]
description = "False positive: a list of provider API host names (api.segment.io and similar). No secret."
targetRules = ["generic-api-key"]
paths = ['''(^|[/\\])packages/shared/src/constants/provider-api-hosts\.ts$''']

[[allowlists]]
description = "Test constant: a patterned fixture key whose hash the test computes. Not a credential."
targetRules = ["generic-api-key"]
paths = ['''(^|[/\\])packages/shared/src/utils/api-key-hash\.test\.ts$''']

[[allowlists]]
description = "False positive: a URL on api.stripe.com in a hostname-parsing test. No secret."
targetRules = ["generic-api-key"]
paths = ['''(^|[/\\])packages/shared/src/utils/host-binding\.test\.ts$''']
